[workspace]
resolver = "3"
# The app and its prototype build on their own (docs/APP.md): they need CEF and GPUI.
exclude = ["app", "prototypes"]
members = [
    "crates/scanline-cdp",
    "crates/scanline-browser",
    "crates/scanline-image",
    "crates/scanline-store",
    "crates/scanline-core",
    "crates/scanline-mcp",
    "crates/scanline",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
flate2 = "1"
libc = "0.2"
png = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }

scanline-cdp = { path = "crates/scanline-cdp" }
scanline-browser = { path = "crates/scanline-browser" }
scanline-image = { path = "crates/scanline-image" }
scanline-store = { path = "crates/scanline-store" }
scanline-core = { path = "crates/scanline-core" }
scanline-mcp = { path = "crates/scanline-mcp" }

[profile.release]
opt-level = 3
lto = "thin"
