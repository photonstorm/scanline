[workspace]
resolver = "3"
members = [
    "crates/scanline-cdp",
    "crates/scanline-browser",
    "crates/scanline-image",
    "crates/scanline-store",
    "crates/scanline-core",
    "crates/scanline-mcp",
    "crates/scanline",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
flate2 = "1"
libc = "0.2"
png = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs", "signal"] }

scanline-cdp = { path = "crates/scanline-cdp" }
scanline-browser = { path = "crates/scanline-browser" }
scanline-image = { path = "crates/scanline-image" }
scanline-store = { path = "crates/scanline-store" }
scanline-core = { path = "crates/scanline-core" }
scanline-mcp = { path = "crates/scanline-mcp" }

[profile.release]
opt-level = 3
lto = "thin"
