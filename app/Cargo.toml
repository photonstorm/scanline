[package]
name = "scanline-app"
version = "0.0.1"
edition = "2024"
publish = false
license = "PolyForm-Shield-1.0.0"
description = "The Scanline app: the game in Chromium and Scanline's panels beside it (docs/APP.md)."

# A workspace of its own: it needs CEF and GPUI, which the host and its tests do not, and
# builds with app/bundle.sh.
[workspace]

[[bin]]
name = "Scanline"
path = "src/main.rs"

[dependencies]
cef = "=156.4.0"
# GPUI's own Windows manifest is left out: the app has its own (build.rs).
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
# Already in the build through GPUI: the magnifier reads the pixels of what it shows.
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Already in the build through GPUI: compiles the app's manifest in (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[profile.release]
opt-level = 3
lto = "thin"
