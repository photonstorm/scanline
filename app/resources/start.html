<!doctype html>
<meta charset="utf-8">
<title>Scanline</title>
<style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #050608; color: #dde2e8; font: 15px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; }
    body { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; }
    main { width: min(46rem, calc(100% - 3rem)); padding: 2rem 0; }
    h1 { font-weight: 200; font-size: 2.6rem; letter-spacing: 0.02em; margin: 0 0 0.2rem; color: #4ade80; text-shadow: 0 0 18px rgba(74, 222, 128, 0.35); }
    p.lead { margin: 0 0 1.5rem; color: #9aa3b2; }
    canvas { display: block; width: 100%; height: 13rem; border-radius: 10px; border: 1px solid rgba(74, 222, 128, 0.25); background: #000; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.8rem; margin-top: 1.2rem; }
    .card { padding: 0.9rem 1rem; border-radius: 10px; background: #111419; border: 1px solid rgba(96, 165, 250, 0.25); }
    .card h2 { margin: 0 0 0.4rem; font-weight: 300; font-size: 1.05rem; color: #60a5fa; }
    .card.purple { border-color: rgba(192, 132, 252, 0.3); } .card.purple h2 { color: #c084fc; }
    .card.amber { border-color: rgba(251, 191, 36, 0.3); } .card.amber h2 { color: #fbbf24; }
    kbd { font: 12px Menlo, monospace; padding: 1px 6px; border-radius: 5px; background: #1b2028; border: 1px solid #2c333f; color: #dde2e8; }
    ul { margin: 0; padding-left: 1.1rem; } li { margin: 0.15rem 0; color: #b8c0cc; }
    code { font: 13px Menlo, monospace; color: #fbbf24; }
    h2.section { margin: 0 0 0.7rem; font-weight: 300; font-size: 1.15rem; color: #22d3ee; letter-spacing: 0.02em; }
    .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.9rem; margin-bottom: 2rem; }
    .project { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.55rem; border-radius: 10px; background: #0d1015; border: 1px solid rgba(34, 211, 238, 0.18); color: inherit; text-decoration: none; transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s; }
    .project:hover { border-color: rgba(34, 211, 238, 0.7); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(34, 211, 238, 0.12); }
    .project img, .project .blank { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #000; margin-bottom: 0.35rem; }
    .project .blank { background: repeating-linear-gradient(135deg, #0b0e12 0 10px, #10141a 10px 20px); }
    .project .title { font-size: 0.95rem; color: #e6ebf1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project .url { font: 11.5px Menlo, monospace; color: #6b7686; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project .when { font-size: 0.78rem; color: #8b95a4; }
</style>
<main>
    <h1>Scanline</h1>
    <h2 class="section">Projects</h2>
    <!-- projects -->
    <canvas id="scene" width="1280" height="420"></canvas>
    <div class="grid">
        <div class="card">
            <h2>Open</h2>
            <ul>
                <li><kbd>⌘L</kbd> address</li>
                <li><kbd>⌘N</kbd> new window</li>
                <li><kbd>⌘R</kbd> reload</li>
                <li><kbd>⇧⌘E</kbd> size · <kbd>⇧⌘M</kbd> mute</li>
                <li><kbd>Esc</kbd> release pointer</li>
            </ul>
        </div>
        <div class="card amber">
            <h2>Time</h2>
            <ul>
                <li><kbd>⌘.</kbd> pause</li>
                <li><kbd>⌘'</kbd> step</li>
                <li><kbd>⌘[</kbd> <kbd>⌘]</kbd> speed</li>
            </ul>
        </div>
        <div class="card purple">
            <h2>Inspect</h2>
            <ul>
                <li><kbd>⇧⌘C</kbd> capture</li>
                <li><kbd>⌘1</kbd>–<kbd>⌘6</kbd> panels</li>
                <li><kbd>⌘\</kbd> wide</li>
            </ul>
        </div>
    </div>
    <p class="lead" style="margin-top: 1.4rem; font-size: 0.8rem">Icons: Streamline Core Line Free (streamlinehq.com), CC BY 4.0.</p>
</main>
<script>
// A small WebGL scene, so the panels have something to measure: a ring of glowing bars.
const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl2');
const compile = (type, source) => { const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader); return shader; };
const program = gl.createProgram();

gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
    in vec2 corner;
    uniform float time;
    uniform float aspect;
    out float shade;
    void main () {
        float bar = float(gl_InstanceID);
        float angle = bar / 48.0 * 6.2831853 + time * 0.3;
        float height = 0.18 + 0.12 * sin(time * 2.0 + bar * 0.5);
        vec2 p = vec2(corner.x * 0.025, corner.y * height + 0.32);
        vec2 r = vec2(p.x * cos(angle) - p.y * sin(angle), p.x * sin(angle) + p.y * cos(angle));
        shade = corner.y;
        gl_Position = vec4(r.x / aspect, r.y, 0.0, 1.0);
    }`));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision mediump float;
    in float shade;
    out vec4 colour;
    void main () { colour = vec4(mix(vec3(0.1, 0.4, 0.9), vec3(0.3, 0.95, 0.55), shade), 1.0); }`));
gl.linkProgram(program);
gl.useProgram(program);

const corners = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, corners);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 0, 1, 0, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const time = gl.getUniformLocation(program, 'time');
const aspect = gl.getUniformLocation(program, 'aspect');

function frame (now)
{
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(time, now / 1000);
    gl.uniform1f(aspect, canvas.width / canvas.height);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 48);
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
