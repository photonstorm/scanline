[package]
name = "scanline"
description = "A browser for debugging WebGL and WebGPU rendering, driven by an agent and shared with a person."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "scanline"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
scanline-core.workspace = true
scanline-browser.workspace = true
scanline-mcp.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
