[package]
name = "scanline-prototype"
version = "0.0.0"
edition = "2024"
publish = false
license = "PolyForm-Shield-1.0.0"

# Its own workspace: stage 0 of docs/APP.md, kept out of the main build.
[workspace]

[dependencies]
base64 = "0.22"
cef = "=156.4.0"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
