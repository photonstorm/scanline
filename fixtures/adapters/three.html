<!doctype html>
<meta charset="utf-8">
<title>Adapter: three.js (WebGL or WebGPU renderer)</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<script type="module">
// A scene with the things that make draws hard to tell apart: a shadow-casting light, an
// instanced mesh, a mesh with two materials, a see-through double-sided mesh, a sprite and
// points. ?renderer=webgpu picks the WebGPU renderer.
const webgpu = new URL(location.href).searchParams.get('renderer') === 'webgpu';
const THREE = await import(webgpu ? '/node_modules/three/build/three.webgpu.js' : '/node_modules/three/build/three.module.js');

const renderer = webgpu ? new THREE.WebGPURenderer({ antialias: false }) : new THREE.WebGLRenderer({ antialias: false });

renderer.setPixelRatio(1);
renderer.setSize(480, 320);
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);

if (webgpu)
{
    await renderer.init();
}

const scene = new THREE.Scene();

scene.name = 'Courtyard';
scene.background = new THREE.Color(0x203040);

const camera = new THREE.PerspectiveCamera(50, 480 / 320, 0.1, 100);

camera.position.set(0, 4, 9);
camera.lookAt(0, 0.5, 0);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);

sun.name = 'Sun';
sun.position.set(4, 8, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(256, 256);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
scene.add(sun, new THREE.AmbientLight(0xffffff, 0.4));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), new THREE.MeshStandardMaterial({ color: 0x556655, name: 'Grass' }));

ground.name = 'Ground';
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Five pillars in one instanced draw.
const pillars = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.3, 2, 12), new THREE.MeshStandardMaterial({ color: 0xbbaa99, name: 'Stone' }), 5);

pillars.name = 'Pillars';
pillars.castShadow = true;

for (let i = 0; i < 5; i++)
{
    pillars.setMatrixAt(i, new THREE.Matrix4().makeTranslation(-4 + i * 2, 1, -2));
}

scene.add(pillars);

// A crate whose top is another material: two draws for one object.
const crate = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), [
    new THREE.MeshStandardMaterial({ color: 0x996633, name: 'Wood' }),
    new THREE.MeshStandardMaterial({ color: 0x999999, name: 'Lid' })
]);

crate.name = 'Crate';
crate.geometry.clearGroups();
crate.geometry.addGroup(0, 12, 0);
crate.geometry.addGroup(12, 6, 1);
crate.geometry.addGroup(18, 18, 0);
crate.position.set(-1.5, 0.7, 1);
crate.castShadow = true;
scene.add(crate);

// Glass: transparent and double-sided, which three.js draws in two goes.
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 12), new THREE.MeshStandardMaterial({ color: 0x66aaff, transparent: true, opacity: 0.5, side: THREE.DoubleSide, name: 'Glass' }));

glass.name = 'GlassBall';
glass.position.set(1.5, 0.8, 1);
scene.add(glass);

const marker = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xffcc33, name: 'MarkerMaterial' }));

marker.name = 'Marker';
marker.position.set(0, 2.6, 0);
marker.scale.set(0.5, 0.5, 1);
scene.add(marker);

const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array.from({ length: 90 }, (_, i) => Math.sin(i * 12.9898) * 4), 3)), new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, name: 'DustMaterial' }));

dust.name = 'Dust';
dust.position.y = 2;
scene.add(dust);

const timer = new THREE.Timer();
const state = window.fixture = { name: webgpu ? 'adapter-three-webgpu' : 'adapter-three-webgl', frames: 0, elapsed: 0 };

renderer.setAnimationLoop((timestamp) =>
{
    timer.update(timestamp);
    state.elapsed = timer.getElapsed() * 1000;

    glass.position.y = 0.8 + 0.3 * Math.sin(state.elapsed / 400);
    crate.rotation.y = state.elapsed / 2000;

    renderer.render(scene, camera);
    state.frames++;
});
</script>
