<!doctype html>
<meta charset="utf-8">
<title>A simulation stepped by transform feedback: a WebGL 2 frame with known answers</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="game" width="160" height="120"></canvas>
<script type="module">
// Each frame transform feedback moves a bar 8 px to the right: a vertex shader reads
// a number from one buffer, adds 8, and writes it to another, and the two swap. The bar is
// then drawn where the number says. After the first frame only the GPU writes the buffers.
//
//   frame n (counting from 1): the bar covers x 8n to 8n + 8, for the whole height, on
//   a background of (26, 26, 26). It is (255, 204, 0): the colour in a uniform block that
//   is bound to its numbered binding point once, before the first frame.
//
// So frame 3 has the bar at x 24–32. A capture of frame 3 has to hold the buffers as
// frame 2 left them: read after the frame they hold frame 3's step, and a replay would
// step them again.
const canvas = document.getElementById('game');
const gl = canvas.getContext('webgl2', { antialias: false });
const state = window.game = { frame: 0 };

const program = (vertex, fragment, varyings) =>
{
    const made = gl.createProgram();

    for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]])
    {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, `#version 300 es\n${source}`);
        gl.compileShader(shader);
        gl.attachShader(made, shader);
    }

    if (varyings)
    {
        gl.transformFeedbackVaryings(made, varyings, gl.SEPARATE_ATTRIBS);
    }

    gl.linkProgram(made);

    return made;
};

const step = program(
    'layout(location = 0) in float x; out float moved; void main () { moved = x + 8.0; }',
    'precision mediump float; out vec4 colour; void main () { colour = vec4(0.0); }',
    ['moved']
);
const bar = program(
    `layout(location = 0) in float x; layout(location = 1) in vec2 corner;
     void main () { gl_Position = vec4((x + corner.x * 8.0) / 80.0 - 1.0, corner.y * 2.0 - 1.0, 0.0, 1.0); }`,
    'precision mediump float; uniform Tint { vec4 tint; }; out vec4 colour; void main () { colour = tint; }'
);

// The bar's colour comes from a uniform block, bound once, here, to the second half of a
// buffer whose first half holds another colour: (255, 204, 0), not (255, 0, 0).
const tints = gl.createBuffer();
const tintData = new Float32Array(128);

tintData.set([1, 0, 0, 1], 0);
tintData.set([1, 0.8, 0, 1], 64);
gl.bindBuffer(gl.UNIFORM_BUFFER, tints);
gl.bufferData(gl.UNIFORM_BUFFER, tintData, gl.STATIC_DRAW);
gl.bindBuffer(gl.UNIFORM_BUFFER, null);
gl.bindBufferRange(gl.UNIFORM_BUFFER, 3, tints, 256, 16);
gl.uniformBlockBinding(bar, gl.getUniformBlockIndex(bar, 'Tint'), 3);

const places = [0, 1].map(() =>
{
    const buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0]), gl.DYNAMIC_COPY);

    return buffer;
});

const corners = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, corners);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(0);
gl.vertexAttribDivisor(0, 1);

function frame ()
{
    const from = places[state.frame % 2];
    const to = places[(state.frame + 1) % 2];

    state.frame++;

    // The step: one point, not drawn, whose shader's output goes to the other buffer.
    gl.useProgram(step);
    gl.bindBuffer(gl.ARRAY_BUFFER, from);
    gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(0, 0);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, to);
    gl.enable(gl.RASTERIZER_DISCARD);
    gl.beginTransformFeedback(gl.POINTS);
    gl.drawArrays(gl.POINTS, 0, 1);
    gl.endTransformFeedback();
    gl.disable(gl.RASTERIZER_DISCARD);
    gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);

    // The bar, where the stepped number says.
    gl.clearColor(0.1, 0.1, 0.1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(bar);
    gl.bindBuffer(gl.ARRAY_BUFFER, to);
    gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(0, 1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 1);
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
