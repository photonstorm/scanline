<!doctype html>
<meta charset="utf-8">
<title>A scene put on the canvas by a full-screen pass</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="160" height="120"></canvas>
<script type="module">
// The way most games end a frame: the scene is drawn to a texture, and a full-screen quad that
// samples it puts it on the canvas. Raw WebGL 2.
//
//   The texture is cleared to blue and a red triangle drawn on it, covering the centre
//   (80, 60) and not the top-right corner (150, 10).
//   The canvas is cleared to black, then the quad (a strip of four vertices) shows the texture.
//
// Under the live wireframe the triangle is an outline, so the centre is blue, and the quad is
// drawn filled, since it is a full-screen pass: the corner is blue too, not the canvas's black.
const gl = document.getElementById('scene').getContext('webgl2', { antialias: false, alpha: false });

function program (vertex, fragment)
{
    const made = gl.createProgram();

    for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]])
    {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        gl.attachShader(made, shader);
    }

    gl.linkProgram(made);

    return made;
}

const scene = program(`#version 300 es
    const vec2 corners[3] = vec2[3](vec2(-0.8, -0.8), vec2(0.8, -0.8), vec2(0.0, 0.8));
    void main () { gl_Position = vec4(corners[gl_VertexID], 0.0, 1.0); }`, `#version 300 es
    precision highp float;
    out vec4 result;
    void main () { result = vec4(1.0, 0.0, 0.0, 1.0); }`);

const show = program(`#version 300 es
    void main () { gl_Position = vec4(float(gl_VertexID % 2) * 2.0 - 1.0, float(gl_VertexID / 2) * 2.0 - 1.0, 0.0, 1.0); }`, `#version 300 es
    precision highp float;
    uniform sampler2D picture;
    out vec4 result;
    void main () { result = vec4(texelFetch(picture, ivec2(gl_FragCoord.xy), 0).rgb, 1.0); }`);

const texture = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 160, 120);

const target = gl.createFramebuffer();

gl.bindFramebuffer(gl.FRAMEBUFFER, target);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);

function frame ()
{
    gl.viewport(0, 0, 160, 120);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target);
    gl.clearColor(0, 0, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(scene);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(show);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    window.fixture = { name: 'composite', frames: (window.fixture?.frames ?? 0) + 1 };
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
