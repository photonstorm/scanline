<!doctype html>
<meta charset="utf-8">
<title>Views: a stencil buffer and mip levels with known answers</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="game" width="320" height="240"></canvas>
<script>
// Every answer here can be worked out by hand.
//
// Stencil (cleared to 0 each frame):
//   square A, 100×100 at (20, 20), replaces the stencil with 5
//   square B, 100×100 at (80, 80), adds 1 to it
//   so: 6 where they overlap (40×40 = 1,600 px), 5 on the rest of A (8,400 px),
//       1 on the rest of B (8,400 px), 0 everywhere else (58,400 px).
//
// Mip levels: one 64×64 texture with a full chain, sampled with LINEAR_MIPMAP_NEAREST,
// so each pixel reads exactly one level:
//   64×64 at (240, 16): level 0    (4,096 px)
//   16×16 at (240, 96): level 2    (256 px)
//    8×8  at (240, 128): level 3   (64 px)
// A second texture, 32×32 with no mipmaps (LINEAR), is drawn 32×32 at (200, 180).
const canvas = document.getElementById('game');
const gl = canvas.getContext('webgl2', { antialias: false, stencil: true, alpha: false });

function program (vertex, fragment)
{
    const made = gl.createProgram();

    for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]])
    {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        gl.attachShader(made, shader);
    }

    gl.linkProgram(made);

    return made;
}

// A rectangle given in pixels from the top-left of the canvas.
const quad = program(`#version 300 es
    uniform vec4 rect;
    out vec2 uv;
    void main ()
    {
        vec2 corner = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1));
        vec2 at = rect.xy + corner * rect.zw;
        uv = corner;
        gl_Position = vec4(at.x / 160.0 - 1.0, 1.0 - at.y / 120.0, 0.0, 1.0);
    }`, `#version 300 es
    precision mediump float;
    uniform vec4 tint;
    uniform sampler2D map;
    uniform float textured;
    in vec2 uv;
    out vec4 colour;
    void main ()
    {
        colour = mix(tint, texture(map, uv), textured);
    }`);

const rect = gl.getUniformLocation(quad, 'rect');
const tint = gl.getUniformLocation(quad, 'tint');
const textured = gl.getUniformLocation(quad, 'textured');

// A checkerboard, so the texture is not one flat colour of its own.
function checker (size, a, b)
{
    const data = new Uint8Array(size * size * 4);

    for (let y = 0; y < size; y++)
    {
        for (let x = 0; x < size; x++)
        {
            data.set(((x >> 2) + (y >> 2)) & 1 ? a : b, (y * size + x) * 4);
        }
    }

    return data;
}

const mipped = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, mipped);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, checker(64, [230, 200, 150, 255], [120, 90, 60, 255]));
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const plain = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, plain);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 32, 32, 0, gl.RGBA, gl.UNSIGNED_BYTE, checker(32, [150, 200, 230, 255], [60, 90, 120, 255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

const state = window.game = { frame: 0 };

function draw (x, y, width, height, colour, texture)
{
    gl.uniform4f(rect, x, y, width, height);
    gl.uniform4f(tint, colour[0], colour[1], colour[2], 1);
    gl.uniform1f(textured, texture ? 1 : 0);
    gl.bindTexture(gl.TEXTURE_2D, texture ?? plain);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function frame ()
{
    state.frame++;

    gl.viewport(0, 0, 320, 240);
    gl.clearColor(0.08, 0.1, 0.16, 1);
    gl.clearStencil(0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    gl.useProgram(quad);

    // The two squares that write the stencil buffer.
    gl.enable(gl.STENCIL_TEST);
    gl.stencilFunc(gl.ALWAYS, 5, 0xFF);
    gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
    draw(20, 20, 100, 100, [0.5, 0.2, 0.2]);
    gl.stencilOp(gl.KEEP, gl.KEEP, gl.INCR);
    draw(80, 80, 100, 100, [0.2, 0.5, 0.2]);
    gl.disable(gl.STENCIL_TEST);

    // The textured squares, each at a size that picks one mip level.
    draw(240, 16, 64, 64, [0, 0, 0], mipped);
    draw(240, 96, 16, 16, [0, 0, 0], mipped);
    draw(240, 128, 8, 8, [0, 0, 0], mipped);
    draw(200, 180, 32, 32, [0, 0, 0], plain);

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
