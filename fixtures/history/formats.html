<!doctype html>
<meta charset="utf-8">
<title>Textures a framebuffer cannot read: a frame with known answers</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="game" width="160" height="120"></canvas>
<script type="module">
// Four columns, each 40 px wide and all 120 px tall, each drawn from a texture that
// readPixels cannot reach. All four are filled before the first frame and never again,
// so a capture has to hold what is in them. WebGL 2, or WebGL 1 with ?gl=1.
//
//   x   0–40   «blocks»     8×8 S3TC (DXT1), four blocks of one colour each
//                           bottom left red, bottom right green, top left blue, top right white
//   x  40–80   «luminance»  2×2 LUMINANCE: bottom 0 and 85, top 170 and 255, as greys
//   x  80–120  «alpha»      2×2 ALPHA: bottom 255 and 170, top 85 and 0, shown as greys
//   x 120–160  «shadow»     16×16 depth, drawn once: 0.25 on its left half, 1 on its right,
//                           shown as greys 64 and 255
//
// The frame's events: 0 clears to (26, 26, 26); 1 to 4 draw the columns, left to right.
// window.game.compressed is false where the machine has no S3TC: column 0 is then left out.
const canvas = document.getElementById('game');
const one = new URLSearchParams(location.search).get('gl') === '1';
const gl = canvas.getContext(one ? 'webgl' : 'webgl2', { antialias: false });
const state = window.game = { frame: 0, compressed: false, depth: false };

const shader = (type, source) =>
{
    const made = gl.createShader(type);

    gl.shaderSource(made, source);
    gl.compileShader(made);

    return made;
};

const program = gl.createProgram();

gl.attachShader(program, shader(gl.VERTEX_SHADER, `
    attribute vec2 corner;
    uniform vec4 rect;
    uniform float z;
    varying vec2 uv;
    void main () { uv = corner; gl_Position = vec4(mix(rect.xy, rect.zw, corner), z, 1.0); }
`));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform sampler2D map;
    uniform int mode;
    varying vec2 uv;
    void main ()
    {
        vec4 texel = texture2D(map, uv);

        gl_FragColor = vec4(mode == 0 ? texel.rgb : (mode == 2 ? vec3(texel.a) : vec3(texel.r)), 1.0);
    }
`));
gl.bindAttribLocation(program, 0, 'corner');
gl.linkProgram(program);
gl.useProgram(program);

const corners = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, corners);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const rect = gl.getUniformLocation(program, 'rect');
const mode = gl.getUniformLocation(program, 'mode');
const z = gl.getUniformLocation(program, 'z');

const nearest = () =>
{
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
};

// «blocks»: each DXT1 block is two RGB565 colours and sixteen 2-bit choices between them.
const s3tc = gl.getExtension('WEBGL_compressed_texture_s3tc');
const blocks = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, blocks);
nearest();

if (s3tc)
{
    const solid = (low, high) => [low, high, low, high, 0, 0, 0, 0];
    const data = new Uint8Array([...solid(0x00, 0xF8), ...solid(0xE0, 0x07), ...solid(0x1F, 0x00), ...solid(0xFF, 0xFF)]);

    if (one)
    {
        gl.compressedTexImage2D(gl.TEXTURE_2D, 0, s3tc.COMPRESSED_RGB_S3TC_DXT1_EXT, 8, 8, 0, data);
    }
    else
    {
        gl.texStorage2D(gl.TEXTURE_2D, 1, s3tc.COMPRESSED_RGB_S3TC_DXT1_EXT, 8, 8);
        gl.compressedTexSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 8, 8, s3tc.COMPRESSED_RGB_S3TC_DXT1_EXT, data);
    }

    state.compressed = true;
}

gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

const luminance = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, luminance);
nearest();
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, 2, 2, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, new Uint8Array([0, 85, 170, 255]));

const alpha = gl.createTexture();

gl.bindTexture(gl.TEXTURE_2D, alpha);
nearest();
gl.texImage2D(gl.TEXTURE_2D, 0, gl.ALPHA, 2, 2, 0, gl.ALPHA, gl.UNSIGNED_BYTE, new Uint8Array([255, 170, 85, 0]));

// «shadow»: a depth texture drawn to once, here, and only sampled from then on.
const shadow = gl.createTexture();

if (!one || gl.getExtension('WEBGL_depth_texture'))
{
    const colour = gl.createTexture();
    const framebuffer = gl.createFramebuffer();

    gl.bindTexture(gl.TEXTURE_2D, colour);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 16, 16, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindTexture(gl.TEXTURE_2D, shadow);
    nearest();

    if (one)
    {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT, 16, 16, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
    }
    else
    {
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, 16, 16);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colour, 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadow, 0);
    gl.viewport(0, 0, 16, 16);
    gl.enable(gl.DEPTH_TEST);
    gl.clearDepth(1);
    gl.clear(gl.DEPTH_BUFFER_BIT | gl.COLOR_BUFFER_BIT);

    // The left half, at a depth of 0.25.
    gl.bindTexture(gl.TEXTURE_2D, luminance);
    gl.uniform4f(rect, -1, -1, 0, 1);
    gl.uniform1f(z, -0.5);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disable(gl.DEPTH_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(framebuffer);
    gl.deleteTexture(colour);
    state.depth = true;
}

const columns = [[blocks, 0, state.compressed], [luminance, 1, true], [alpha, 2, true], [shadow, 3, state.depth]];

function frame ()
{
    state.frame++;

    gl.viewport(0, 0, 160, 120);
    gl.clearColor(0.1, 0.1, 0.1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(z, 0);

    columns.forEach(([texture, how, drawn], index) =>
    {
        if (drawn)
        {
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.uniform1i(mode, how);
            gl.uniform4f(rect, -1 + index * 0.5, -1, -0.5 + index * 0.5, 1);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
    });

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
