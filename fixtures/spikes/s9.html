<!doctype html>
<meta charset="utf-8">
<title>Spike S9: hook overhead</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="640" height="480"></canvas>
<script type="module">
// ?api=webgl2|webgpu&draws=2000
// Issues `draws` small draws per frame the way an unbatched engine would: per draw, a few
// state calls and one draw call. Times the JavaScript of the frame with the native clock.
const params = new URL(location.href).searchParams;
const api = params.get('api') ?? 'webgl2';
const draws = Number(params.get('draws') ?? 2000);
const canvas = document.getElementById('scene');
const samples = [];

window.s9 = { api, draws, samples, callsPerFrame: 0 };

const record = (ms) =>
{
    samples.push(ms);

    if (samples.length > 400)
    {
        samples.shift();
    }
};

if (api === 'webgl2')
{
    const gl = canvas.getContext('webgl2', { antialias: false });
    const compile = (type, source) =>
    {
        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        return shader;
    };
    const program = gl.createProgram();

    gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
        layout(location = 0) in vec2 corner;
        uniform vec4 rect;
        void main () { gl_Position = vec4(rect.xy + corner * rect.zw, 0.0, 1.0); }`));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
        precision mediump float;
        uniform vec4 colour;
        uniform sampler2D map;
        out vec4 result;
        void main () { result = colour * texture(map, vec2(0.5)); }`));
    gl.linkProgram(program);
    gl.useProgram(program);

    const buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    const textures = [0, 1].map((i) =>
    {
        const texture = gl.createTexture();

        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255 - i * 40, 255, 255]));
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);

        return texture;
    });

    const rect = gl.getUniformLocation(program, 'rect');
    const colour = gl.getUniformLocation(program, 'colour');

    // Five calls per draw: bindTexture, two uniforms, a blend toggle, the draw.
    window.s9.callsPerFrame = draws * 5 + 2;

    const frame = () =>
    {
        const start = performance.now();

        gl.clearColor(0.1, 0.2, 0.3, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);

        for (let i = 0; i < draws; i++)
        {
            const x = (i % 100) / 50 - 1;
            const y = Math.floor(i / 100) / 50 - 1;

            gl.bindTexture(gl.TEXTURE_2D, textures[i & 1]);
            gl.uniform4f(rect, x, y, 0.018, 0.018);
            gl.uniform4f(colour, (i % 7) / 7, (i % 5) / 5, (i % 3) / 3, 1);

            if (i & 1) { gl.enable(gl.BLEND); } else { gl.disable(gl.BLEND); }

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        record(performance.now() - start);
        requestAnimationFrame(frame);
    };

    requestAnimationFrame(frame);
}
else
{
    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();

    context.configure({ device, format, alphaMode: 'opaque' });

    const module = device.createShaderModule({ code: `
        struct U { rect: vec4f, colour: vec4f }
        @group(0) @binding(0) var<uniform> u: U;
        @vertex fn vs (@builtin(vertex_index) index: u32) -> @builtin(position) vec4f
        {
            let corner = vec2f(f32(index & 1u), f32(index >> 1u));
            return vec4f(u.rect.xy + corner * u.rect.zw, 0.0, 1.0);
        }
        @fragment fn fs () -> @location(0) vec4f { return u.colour; }` });

    const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module },
        fragment: { module, targets: [{ format }] },
        primitive: { topology: 'triangle-strip' }
    });

    // One uniform buffer with a 256-byte slot per draw, and one bind group per slot,
    // as an engine with per-object uniforms has.
    const uniforms = device.createBuffer({ size: draws * 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const data = new Float32Array(draws * 64);

    for (let i = 0; i < draws; i++)
    {
        data.set([(i % 100) / 50 - 1, Math.floor(i / 100) / 50 - 1, 0.018, 0.018, (i % 7) / 7, (i % 5) / 5, (i % 3) / 3, 1], i * 64);
    }

    device.queue.writeBuffer(uniforms, 0, data);

    const groups = Array.from({ length: draws }, (_, i) => device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uniforms, offset: i * 256, size: 32 } }]
    }));

    // Two calls per draw: setBindGroup and draw. Plus the per-frame handful.
    window.s9.callsPerFrame = draws * 2 + 8;

    const frame = () =>
    {
        const start = performance.now();
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
            colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.1, 0.2, 0.3, 1], loadOp: 'clear', storeOp: 'store' }]
        });

        pass.setPipeline(pipeline);

        for (let i = 0; i < draws; i++)
        {
            pass.setBindGroup(0, groups[i]);
            pass.draw(4);
        }

        pass.end();
        device.queue.submit([encoder.finish()]);

        record(performance.now() - start);
        requestAnimationFrame(frame);
    };

    requestAnimationFrame(frame);
}
</script>
