<!doctype html>
<meta charset="utf-8">
<title>Inventory: WebGL 2 objects with known contents</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="320" height="240"></canvas>
<script type="module">
// Objects with known sizes and contents, for checking what the inventory reports.
// See ../README.md, "Inventory pages".
const gl = document.getElementById('scene').getContext('webgl2', { antialias: false });

gl.getExtension('EXT_color_buffer_float');

function makeTexture (width, height, internalFormat, format, type, data, filter = gl.NEAREST)
{
    const texture = gl.createTexture();

    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, width, height, 0, format, type, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

    return texture;
}

// 4×4 RGBA8: texel (x, y) is (x × 60, y × 60, 128, 255).
const checkerData = new Uint8Array(4 * 4 * 4);

for (let y = 0; y < 4; y++)
{
    for (let x = 0; x < 4; x++)
    {
        checkerData.set([x * 60, y * 60, 128, 255], (y * 4 + x) * 4);
    }
}

const checker = makeTexture(4, 4, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, checkerData);

// 64×64 RGBA8, one colour, with a full mip chain (7 levels).
const mipped = makeTexture(64, 64, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(64 * 64 * 4).map((_, i) => [10, 20, 30, 255][i % 4]), gl.LINEAR_MIPMAP_LINEAR);

gl.generateMipmap(gl.TEXTURE_2D);

// 2×2 RGBA32F with values outside 0–1.
const floaty = makeTexture(2, 2, gl.RGBA32F, gl.RGBA, gl.FLOAT, new Float32Array([
    0.25, 1.5, -2, 1,   100, 0, 0, 1,
    0, 0.5, 0, 0.5,     1, 1, 1, 1
]));

// A 32×16 render target: magenta, with its lower half (as rendered) cyan.
const target = makeTexture(32, 16, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null);
const framebuffer = gl.createFramebuffer();

gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

const vertices = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1, 0.5, 1.5, 2.5, 3.5]), gl.STATIC_DRAW);

const indices = gl.createBuffer();

gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indices);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 2, 1, 3]), gl.STATIC_DRAW);

const compile = (type, source) =>
{
    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return shader;
};

const program = gl.createProgram();

gl.attachShader(program, compile(gl.VERTEX_SHADER, `#version 300 es
layout(location = 0) in vec2 corner;
uniform float scale;
out vec2 uv;
void main ()
{
    uv = corner * 0.5 + 0.5;
    gl_Position = vec4(corner * scale, 0.0, 1.0);
}`));

gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `#version 300 es
precision mediump float;
uniform sampler2D map;
uniform vec4 tint;
uniform float bias;
in vec2 uv;
out vec4 colour;
void main ()
{
    colour = texture(map, uv) * tint + bias;
}`));

gl.linkProgram(program);
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// `bias` is never set: it holds its default.
gl.uniform1f(gl.getUniformLocation(program, 'scale'), 0.5);
gl.uniform4f(gl.getUniformLocation(program, 'tint'), 0.25, 0.5, 0.75, 1);
gl.uniform1i(gl.getUniformLocation(program, 'map'), 0);

// A broken shader, kept so its log can be read.
window.broken = compile(gl.FRAGMENT_SHADER, `#version 300 es
precision mediump float;
out vec4 colour;
void main () { colour = vec4(undefinedName, 1.0); }`);

const leaked = [];

function leakTexture ()
{
    return makeTexture(256, 256, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, null);
}

// Creates `count` textures that are never deleted, all from one line of code.
window.leak = (count) =>
{
    for (let i = 0; i < count; i++)
    {
        leaked.push(leakTexture());
    }

    gl.bindTexture(gl.TEXTURE_2D, checker);

    return leaked.length;
};

const state = window.fixture = { name: 'inventory-webgl2', frames: 0 };

function frame ()
{
    // The render target: magenta, then its lower 8 rows cyan.
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.viewport(0, 0, 32, 16);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(1, 0, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(0, 0, 32, 8);
    gl.clearColor(0, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);

    // The canvas: the checker texture on a half-size quad, blended.
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, 320, 240);
    gl.clearColor(32 / 255, 64 / 255, 96 / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, checker);
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);

    state.frames++;
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
