<!doctype html>
<meta charset="utf-8">
<title>Matrix: WebGL 2 in a worker</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="320" height="240"></canvas>
<script type="module">
const offscreen = document.getElementById('scene').transferControlToOffscreen();
const worker = new Worker('./worker.js', { type: 'module' });

worker.postMessage({ canvas: offscreen }, [offscreen]);

window.readFixture = () => new Promise((resolve) =>
{
    worker.onmessage = (event) => resolve(event.data);
    worker.postMessage('state');
});
</script>
