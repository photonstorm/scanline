<!doctype html>
<meta charset="utf-8">
<title>Inventory: WebGPU objects with known contents</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="320" height="240"></canvas>
<script type="module">
// Objects with known sizes and contents, for checking what the inventory reports.
// See ../README.md, "Inventory pages".
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const context = document.getElementById('scene').getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();

context.configure({ device, format, alphaMode: 'opaque' });

// 4×4 rgba8unorm: texel (x, y) is (x × 60, y × 60, 128, 255).
const checkerData = new Uint8Array(4 * 4 * 4);

for (let y = 0; y < 4; y++)
{
    for (let x = 0; x < 4; x++)
    {
        checkerData.set([x * 60, y * 60, 128, 255], (y * 4 + x) * 4);
    }
}

const checker = device.createTexture({ label: 'checker', size: [4, 4], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });

device.queue.writeTexture({ texture: checker }, checkerData, { bytesPerRow: 16 }, [4, 4]);

// 2×2 rgba16float with values outside 0–1.
const floaty = device.createTexture({ label: 'floaty', size: [2, 2], format: 'rgba32float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });

device.queue.writeTexture({ texture: floaty }, new Float32Array([
    0.25, 1.5, -2, 1,   100, 0, 0, 1,
    0, 0.5, 0, 0.5,     1, 1, 1, 1
]), { bytesPerRow: 32 }, [2, 2]);

// 64×64 with a declared mip chain of 7 levels.
const mipped = device.createTexture({ label: 'mipped', size: [64, 64], mipLevelCount: 7, format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });

// A 32×16 render target, cleared to magenta every frame, with its lower half drawn cyan.
const target = device.createTexture({ label: 'offscreen', size: [32, 16], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });

const vertices = device.createBuffer({ label: 'quad vertices', size: 48, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });

device.queue.writeBuffer(vertices, 0, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1, 0.5, 1.5, 2.5, 3.5]));

const uniforms = device.createBuffer({ label: 'tint', size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

device.queue.writeBuffer(uniforms, 0, new Float32Array([0.25, 0.5, 0.75, 1]));

const module = device.createShaderModule({
    label: 'textured quad',
    code: `
struct Tint { colour: vec4f }

@group(0) @binding(0) var map: texture_2d<f32>;
@group(0) @binding(1) var smp: sampler;
@group(0) @binding(2) var<uniform> tint: Tint;

struct Out { @builtin(position) position: vec4f, @location(0) uv: vec2f }

@vertex fn vs (@location(0) corner: vec2f) -> Out
{
    return Out(vec4f(corner * 0.5, 0.0, 1.0), corner * 0.5 + 0.5);
}

// Fills the viewport.
@vertex fn full (@location(0) corner: vec2f) -> @builtin(position) vec4f
{
    return vec4f(corner, 0.0, 1.0);
}

@fragment fn fs (in: Out) -> @location(0) vec4f
{
    return textureSample(map, smp, in.uv) * tint.colour;
}

@fragment fn cyan () -> @location(0) vec4f
{
    return vec4f(0.0, 1.0, 1.0, 1.0);
}`
});

const layout = { arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }] };

const pipeline = device.createRenderPipeline({
    label: 'textured quad',
    layout: 'auto',
    vertex: { module, entryPoint: 'vs', buffers: [layout] },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-strip' }
});

const offscreenPipeline = device.createRenderPipeline({
    label: 'offscreen cyan',
    layout: 'auto',
    vertex: { module, entryPoint: 'full', buffers: [layout] },
    fragment: { module, entryPoint: 'cyan', targets: [{ format: 'rgba8unorm' }] },
    primitive: { topology: 'triangle-strip' }
});

const sampler = device.createSampler({ label: 'nearest', magFilter: 'nearest', minFilter: 'nearest' });

const group = device.createBindGroup({
    label: 'quad bindings',
    layout: pipeline.getBindGroupLayout(0),
    entries: [
        { binding: 0, resource: checker.createView() },
        { binding: 1, resource: sampler },
        { binding: 2, resource: { buffer: uniforms } }
    ]
});

// A shader with an error, kept so its messages can be read.
device.pushErrorScope('validation');
window.broken = device.createShaderModule({ label: 'broken', code: '@fragment fn fs () -> @location(0) vec4f { return vec4f(undefinedName, 1.0); }' });
device.popErrorScope();

const leaked = [];

function leakTexture ()
{
    return device.createTexture({ size: [256, 256], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING });
}

// Creates `count` textures that are never destroyed, all from one line of code.
window.leak = (count) =>
{
    for (let i = 0; i < count; i++)
    {
        leaked.push(leakTexture());
    }

    return leaked.length;
};

const state = window.fixture = { name: 'inventory-webgpu', frames: 0, format };

function frame ()
{
    const encoder = device.createCommandEncoder();

    // The render target: magenta, then a quad over its lower half (as rendered) in cyan.
    const offscreen = encoder.beginRenderPass({
        colorAttachments: [{ view: target.createView(), clearValue: [1, 0, 1, 1], loadOp: 'clear', storeOp: 'store' }]
    });

    offscreen.setPipeline(offscreenPipeline);
    offscreen.setVertexBuffer(0, vertices, 0, 32);
    offscreen.setViewport(0, 8, 32, 8, 0, 1);
    offscreen.draw(4);
    offscreen.end();

    const pass = encoder.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [32 / 255, 64 / 255, 96 / 255, 1], loadOp: 'clear', storeOp: 'store' }]
    });

    pass.setPipeline(pipeline);
    pass.setBindGroup(0, group);
    pass.setVertexBuffer(0, vertices, 0, 32);
    pass.draw(4);
    pass.end();

    device.queue.submit([encoder.finish()]);

    state.frames++;
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
