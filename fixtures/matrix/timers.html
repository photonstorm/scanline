<!doctype html>
<meta charset="utf-8">
<title>Matrix: WebGL 1 on a timer</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="320" height="240"></canvas>
<script type="module">
import { QUADS, instanceData, loop } from './scene.js';

const gl = document.getElementById('scene').getContext('webgl', { antialias: false });

const compile = (type, source) =>
{
    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    return shader;
};

const program = gl.createProgram();

gl.attachShader(program, compile(gl.VERTEX_SHADER, `
    attribute vec2 corner;
    uniform vec4 rect;
    void main () { gl_Position = vec4(rect.xy + corner * rect.zw, 0.0, 1.0); }
`));

gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform vec4 colour;
    void main () { gl_FragColor = colour; }
`));

gl.linkProgram(program);
gl.useProgram(program);

const buffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const rect = gl.getUniformLocation(program, 'rect');
const colour = gl.getUniformLocation(program, 'colour');

// No requestAnimationFrame anywhere: the loop is a 16 ms timer reading performance.now().
loop('timers', (elapsed) =>
{
    const data = instanceData(elapsed);

    gl.viewport(0, 0, 320, 240);

    for (let i = 0; i < QUADS.length; i++)
    {
        gl.uniform4fv(rect, data.subarray(i * 8, i * 8 + 4));
        gl.uniform4fv(colour, data.subarray(i * 8 + 4, i * 8 + 8));
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
}, (callback) => setTimeout(() => callback(performance.now()), 16));
</script>
