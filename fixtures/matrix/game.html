<!doctype html>
<meta charset="utf-8">
<title>Matrix: a small game that takes input</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
<canvas id="scene" width="320" height="240"></canvas>
<script type="module">
// A game to replay: a square steered with the arrow keys, sparks thrown from wherever the
// mouse is clicked, each in a random direction. What it shows depends on the input it was
// given, the random numbers it drew and the time that passed, and on nothing else, so a
// deterministic session given the same input draws the same frames.
const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl2', { antialias: false });

const program = gl.createProgram();

for (const [type, source] of [
    [gl.VERTEX_SHADER, `#version 300 es
        uniform vec4 rect;
        void main () {
            vec2 corner = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1));
            vec2 pixel = rect.xy + corner * rect.zw;
            gl_Position = vec4(pixel / vec2(160.0, 120.0) - 1.0, 0.0, 1.0);
            gl_Position.y = -gl_Position.y;
        }`],
    [gl.FRAGMENT_SHADER, `#version 300 es
        precision mediump float;
        uniform vec4 colour;
        out vec4 result;
        void main () { result = colour; }`]
])
{
    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    gl.attachShader(program, shader);
}

gl.linkProgram(program);
gl.useProgram(program);

const rect = gl.getUniformLocation(program, 'rect');
const colour = gl.getUniformLocation(program, 'colour');
const keys = new Set();
const game = window.game = { frame: 0, x: 40, y: 110, sparks: [], clicks: 0, time: 0 };

addEventListener('keydown', (event) => keys.add(event.code));
addEventListener('keyup', (event) => keys.delete(event.code));

canvas.addEventListener('mousedown', (event) =>
{
    game.clicks++;

    for (let i = 0; i < 6; i++)
    {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 80;

        game.sparks.push({ x: event.offsetX, y: event.offsetY, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, life: 1 });
    }
});

function quad (x, y, w, h, r, g, b)
{
    gl.uniform4f(rect, x, y, w, h);
    gl.uniform4f(colour, r, g, b, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

let last = null;

function frame (time)
{
    const dt = last === null ? 0 : (time - last) / 1000;

    last = time;
    game.frame++;
    game.time = time;

    const speed = 90;

    if (keys.has('ArrowRight')) { game.x += speed * dt; }
    if (keys.has('ArrowLeft')) { game.x -= speed * dt; }
    if (keys.has('ArrowDown')) { game.y += speed * dt; }
    if (keys.has('ArrowUp')) { game.y -= speed * dt; }

    game.x = Math.max(0, Math.min(300, game.x));
    game.y = Math.max(0, Math.min(220, game.y));

    for (const spark of game.sparks)
    {
        spark.x += spark.dx * dt;
        spark.y += spark.dy * dt;
        spark.life -= dt * 0.5;
    }

    game.sparks = game.sparks.filter((spark) => spark.life > 0);

    gl.clearColor(0.08, 0.1, 0.16, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    quad(game.x, game.y, 20, 20, 0.2, 0.8, 0.4);

    for (const spark of game.sparks)
    {
        quad(spark.x - 2, spark.y - 2, 4, 4, 1, 0.8 * spark.life, 0.2);
    }

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
